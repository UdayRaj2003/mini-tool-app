<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">

    <title>Mini Tool App</title>

    <!-- Styles -->
     <link rel="stylesheet" href="tailwind-output.css">
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon -->
    <link rel="icon" href="assets/icons/icon-192.png">
</head>

<body>

    <div class="app flex min-h-screen">

        <!-- Sidebar -->
        <div class="w-sidebar-width p-3 border-r border-[#CAC4D0] flex flex-col bg-background-sidebar sidebar" id="sidebar">
            <span class="h-[58px] flex items-center text-sidebar font-semibold px-4 leading-5 tracking-[0.1px] rounded-nav text-text-primary bg-accent-light border border-[#F4ECF5]">Master Tools</span>

            <ul class="list-none p-0">
                <!-- 🔥 SVG ICON -->
                <li id="nav-tools" class="h-[56px] rounded-nav flex items-center gap-3 px-4 text-nav tracking-[0.1px] text-text-primary active">
                    <img src="assets/icons/tool.svg" class="nav-icon">
                    Tools
                </li>

                <li id="nav-favorites" class="h-[56px] rounded-nav flex items-center gap-3 px-4 text-nav tracking-[0.1px] text-text-primary">
                    <img src="assets/icons/heart.svg" class="nav-icon">
                    Favorites
                </li>
            </ul>

            <!-- Search -->
            <div class="relative w-full search-wrapper">
                <img src="assets/icons/search.svg" class="absolute left-[14px] top-1/2 -translate-y-1/2 w-4 h-4 opacity-60 pointer-events-none search-icon">
                <input type="text" placeholder="Search Tools" class="w-full px-3 py-2.5 pl-[42px] rounded-lg border-none outline-none bg-white/70 search-box">
            </div>
        </div>

        <!-- Content -->
        <div class="content flex-1 p-8" id="content">

            <div id="app">

                <!-- Tools -->
                <div id="tools" class="section">
                    <h2 class="mb-5 font-medium text-sidebar tracking-[0.1px] text-text-primary">Latest Tools</h2>
                    <div id="toolContainer" class="card-container"></div>
                </div>

                <!-- Favorites -->
                <div id="favorites" class="section" style="display:none;">
                    <h2 class="mb-5 font-medium text-sidebar tracking-[0.1px] text-text-primary">Favorite Tools</h2>
                    <div id="favContainer" class="card-container"></div>
                </div>

            </div>

        </div>

    </div>

    <!-- Mobile Navigation -->
    <div class="mobile-nav">
        <div id="mob-tools">
            <img src="assets/icons/tool.svg" class="nav-icon">
            Tools
        </div>

        <div id="mob-favorites">
            <img src="assets/icons/heart.svg" class="nav-icon">
            Favorites
        </div>
    </div>

    <!-- JS -->
    <script src="main.js"></script>

</body>

</html>
